volumes:
  tunnel:
  canvas:
  bot-data:

services:
  parabolic:
    build: web/parabolic
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      PARABOLIC_URL: http://parabolic:3000
      CANVAS_PATH: /data/canvas.json
      LEADERBOARD_PATH: /data/leaderboard.json
    depends_on:
      - parabolic
    volumes:
      - canvas:/data

  cloudflared:
    build: cloudflared
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - tunnel:/tunnel
    healthcheck:
      test: ["CMD-SHELL", "test -s /tunnel/url.txt && grep -Eq '^https://[a-z0-9-]+\\.trycloudflare\\.com$' /tunnel/url.txt"]
      interval: 2s
      timeout: 1s
      retries: 45
      start_period: 2s

  bot:
    build:
      context: .
      target: ${DOCKER_TARGET:-runtime}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ALLOWED_LINKS_FILE: /app/data/allowed-links.json
      TELEGRAM_WEBAPP_URL_FILE: /tunnel/url.txt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cloudflared:
        condition: service_healthy
    volumes:
      - tunnel:/tunnel:ro
      - bot-data:/app/data
    deploy:
      resources:
        limits:
          memory: 2G
